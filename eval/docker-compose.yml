# Lab eval lokal — OPSIONAL, hanya bila pilih Docker saat install.
# Tanpa Docker, bench tetap jalan mode no-docker (lihat eval/README.md).
# Jangan jalankan lab ini terhadap target nyata — ini lab lokal saja.
services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    ports:
      - "3000:3000"
    networks: [bounty-lab]

  dvwa:
    image: vulnerables/web-dvwa:latest
    ports:
      - "8080:80"
    networks: [bounty-lab]

  vampi:
    image: erev0s/vampi:latest
    ports:
      - "5000:5000"
    networks: [bounty-lab]

  # P1-3 — GraphQL. Image resmi DVGA (Dolev Farhi).
  dvga:
    image: dolevf/dvga:latest
    ports:
      - "5013:5013"
    networks: [bounty-lab]

  # Lab LLM nyata (v1.3): LLMVault (CyberSunil/LLMVault, MIT, 25 lab
  # OWASP LLM Top 10 2025, Play Mode scripted/offline tanpa API key).
  # Build dari repo resmi via git context (tidak ada image prebuilt
  # resmi yang terverifikasi). Port dipetakan 8000:5000 supaya program
  # llm-app (localhost:8000) tetap jalan. Service ini tidak ikut `up`
  # default (profile: llm). JUJUR: endpoint + oracle llm-app.json
  # (/chat, /tools/execute) ditulis untuk placeholder lama dan BELUM
  # diverifikasi terhadap rute LLMVault — verifikasi live di laptop
  # sebelum angka bench llm-app diklaim. Jangan expose ke internet
  # (sengaja rentan, untuk lab lokal saja).
  llm-app:
    build: https://github.com/CyberSunil/LLMVault.git#main
    ports:
      - "127.0.0.1:8000:5000"
    profiles: ["llm"]
    networks: [bounty-lab]

networks:
  bounty-lab:
    driver: bridge
    internal: false

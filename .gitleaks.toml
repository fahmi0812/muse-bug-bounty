# Gitleaks config — muse-bug-bounty
# Pakai semua rule default, dengan SATU pengecualian yang didokumentasikan:
# tests/secrets.test.js berisi fixture PALSU untuk menguji detektor secret
# (contoh kunci dari dokumentasi Stripe, ID nol, domain example.com,
# password contoh seperti hunter2secret). Bukan kredensial asli.
# Bila ada secret asli masuk ke file itu, pengecualian ini harus dicabut.
[extend]
useDefault = true

[allowlist]
description = "Test fixtures (published example/fake values) in tests/secrets.test.js"
paths = ['''tests/secrets\.test\.js''']
